# Model fallback chain \u2014 ordered by TPM (highest first), TPD as tiebreaker.
# On 429, the next model is tried automatically. Each has independent rate limits.
#
# Model                                    TPM     TPD     Req/Day
# meta-llama/llama-4-scout-17b-16e...     30K     500K    1K
# llama-3.3-70b-versatile                 12K     100K    1K
# openai/gpt-oss-120b                      8K     200K    1K
# openai/gpt-oss-20b                       8K     200K    1K
# llama-3.1-8b-instant                     6K     500K    14.4K
# allam-2-7b                               6K     500K    7K
# qwen/qwen3-32b                           6K     500K    60 (low req/day \u2014 last)
#
# Total free budget: ~2.5M tokens/day across all models
