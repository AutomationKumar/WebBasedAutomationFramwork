
initialSuite=Master Suites
finalSuite=Master Suites

# ---------------- Browser Configuration ----------------
browser=chrome
headless=false
executionMode=local

baseURL=https://automation.crmnextlab.com/master/Login/logout
webURL=https://auto.businessbywire.com/mainlinesql/login/logout
outlookURL=https://outlook.office.com/mail/

# ---------------- Hub Configuration ----------------
hubURL=http://localhost:4444

auto1User=auto1
auto2User=auto2
auto3User=auto3
auto4User=auto4
autorohanUser=rohanauto

adminUser=platform@crmnext.com
businessUser=bus@crmnext.com
nonAdminUser=automation_sub1

# ---------------- Passwords ----------------
encryptedPassword=<ENCRYPTED_PASSWORD>
encryptedOutlookPassword=<ENCRYPTED_OUTLOOK_PASSWORD>

# ---------------- Reporting ----------------
overrideReport=yes
passScreenshot=yes
failScreenshot=yes
skipScreenshot=yes

# ---------------- Execution ----------------
parallelExecution=true
threadCount=4
retryFailedTests=1

# ---------------- Grid Fallback ----------------
grid.local.fallback.enabled=true
grid.local.fallback.max.sessions=4

# ---------------- Screenshot ----------------
screenshot.enabled=true
screenshot.format=JPEG
screenshot.quality=0.7

# ---------------- Logging ----------------
console.redirect=true
log.level=INFO

# ---------------- LLM Configuration ----------------
llm.provider=ollama
llm.endpoint=http://localhost:11434
llm.model=llama3.2

# ---------------- Performance ----------------
performance.tracking.enabled=false

# ---------------- Environment ----------------
environment=QA
database=FreshDB
