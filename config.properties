# ========== Console Logging Control ==========
# Redirect all System.out/System.err to logs/testng-console-output.txt
# true  = quieter console, full output preserved in file
# false = keep println output on console
framework.console.redirect.stdout=true

# Console level for java.util.logging (used by genericLogger.Log)
# Typical values: SEVERE, WARNING, INFO
framework.console.jul.level=WARNING

# Sample INFO logs to reduce logging I/O in heavy runs (0 to 100)
# 100 = log all INFO, 30 = log roughly 30% INFO lines
framework.log.info.sample.percent=100
# Comma-separated keywords that should ALWAYS be logged at INFO level
framework.log.info.always.include.keywords=auto-healing,failed,exception,error

# ========== Extent Step Log Buffering ==========
# Master switch for per-test step trace files
# true  = create steps/<method>_T<thread>_R<retry>.log and link in combined Extent report
# false = keep normal direct Extent INFO logging behavior
framework.steps.logging.enabled=true

# ========== Screenshot Compression Configuration ==========
# Enable/disable screenshot compression (true = JPEG compression, false = PNG)
screenshot.compression.enabled=true
# JPEG compression quality (0.0 to 1.0, higher = better quality but larger file)
# Recommended: 0.7 for good balance between quality and file size
screenshot.compression.quality=0.7
# Screenshot format (JPEG or PNG)
screenshot.format=JPEG
# Maximum screenshot dimensions (resized if larger, maintaining aspect ratio)
screenshot.max.width=1280
screenshot.max.height=720
