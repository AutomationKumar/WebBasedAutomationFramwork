# ========== LLM Provider Configuration ==========
# LLM provider selection with fallback support:
# - Single provider: "ollama" or "openai"
# - Fallback chain: "ollama,openai" (try Ollama first, fallback to OpenAI if it fails)
#                   "openai,ollama" (try OpenAI first, fallback to Ollama if it fails)
# Default: ollama
# Provider fallback chain \u2014 tried in order, skips providers with empty API keys
# Available: groq, cerebras, together, openrouter, sambanova, ollama, openai
llm.provider=groq,cerebras,together,openrouter,sambanova,ollama,openai

# Enable fallback to secondary provider if primary fails (only used for single provider config)
# If llm.provider contains comma-separated values, fallback is automatic
# Default: false
llm.fallback.enabled=false

