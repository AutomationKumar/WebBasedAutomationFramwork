name=PropertiesConfig
property.filename = logs

# ========== Appenders Configuration ==========
appenders = console, rollingFile

# ========== Console Appender ==========
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%-1level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# ========== Rolling File Appender with Compression ==========
# ⚡ OPTIMIZATION: Automatic log rotation and compression for disk space savings
appender.rollingFile.type = RollingFile
appender.rollingFile.name = LOGFILE
appender.rollingFile.fileName = ${filename}/mycrmnext.log
appender.rollingFile.filePattern = ${filename}/archive/mycrmnext-%d{yyyy-MM-dd}-%i.log.gz
appender.rollingFile.layout.type = PatternLayout
appender.rollingFile.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# ========== Rolling Policies ==========
# Roll over daily OR when file reaches 50MB
appender.rollingFile.policies.type = Policies
appender.rollingFile.policies.time.type = TimeBasedTriggeringPolicy
appender.rollingFile.policies.time.interval = 1
appender.rollingFile.policies.time.modulate = true
appender.rollingFile.policies.size.type = SizeBasedTriggeringPolicy
appender.rollingFile.policies.size.size = 5MB

# ========== Rollover Strategy ==========
# Keep only last 7 archived log files, auto-delete older files
appender.rollingFile.strategy.type = DefaultRolloverStrategy
appender.rollingFile.strategy.max = 7
appender.rollingFile.strategy.delete.type = Delete
appender.rollingFile.strategy.delete.basePath = ${filename}/archive
appender.rollingFile.strategy.delete.maxDepth = 1
appender.rollingFile.strategy.delete.ifFileName.type = IfFileName
appender.rollingFile.strategy.delete.ifFileName.glob = mycrmnext-*.log.gz
appender.rollingFile.strategy.delete.ifLastModified.type = IfLastModified
appender.rollingFile.strategy.delete.ifLastModified.age = 7d

# ========== Loggers Configuration ==========
loggers=file
logger.file.name=com.crmnext.testCases
logger.file.level = info
logger.file.appenderRefs = file
logger.file.appenderRef.file.ref = LOGFILE
logger.file.additivity = true

# ========== Framework Loggers (Reduced Verbosity) ==========
# ⚡ OPTIMIZATION: Reduce framework noise - only log errors
logger.selenium.name = org.openqa.selenium
logger.selenium.level = error

logger.appium.name = io.appium
logger.appium.level = error

logger.http.name = org.apache.http
logger.http.level = error

logger.extent.name = com.aventstack.extentreports
logger.extent.level = warn

logger.testng.name = org.testng
logger.testng.level = warn

logger.webdrivermanager.name = io.github.bonigarcia
logger.webdrivermanager.level = error

# ========== Root Logger ==========
rootLogger.level = info
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = LOGFILE